<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vault of the Sunken Crown — a stealth heist</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #0a0d16;
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #game {
    width: min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));
    display: block; background: #101623;
    box-shadow: 0 0 60px rgba(0, 0, 0, 0.8);
    touch-action: none; cursor: crosshair;
  }
  #status {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip-path: inset(50%); white-space: nowrap;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="1280" height="720"
    aria-label="Vault of the Sunken Crown: sneak past guards and cameras, steal the crown, reach the exit"></canvas>
</div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
